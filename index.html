<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: the on-screen keyboard shrinks
         the page rather than sliding over it, so the answer bar's bottom:0
         is already above it and nothing has to be lifted. Chrome and
         Android honour it; Safari does not, which is why the app measures
         the visual viewport as well and lifts the bar itself. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, interactive-widget=resizes-content"
    />
    <title>ManyTongues</title>
    <meta name="description" content="Spaced repetition for language learning." />

    <!-- Colours the browser and status bar chrome, per display mode -->
    <meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141A2A" media="(prefers-color-scheme: dark)" />

    <!-- iOS standalone mode -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ManyTongues" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The browser tab: the dialect-map mark alone, without the name.
         The PNG is for browsers that do not take an SVG icon. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
